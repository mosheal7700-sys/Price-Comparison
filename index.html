<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הסל הזול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap">
<style>
/* Layout: one working surface. Controls on top, a store-by-product price grid below, products down the right edge (RTL), stores across the header row sorted cheapest first, basket totals in a closing row. */
:root {
  color-scheme: light;
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --fg: #14211D;
  --muted: #5B6B66;
  --line: #DAE2DF;
  --accent: #0B6B4F;
  --accent-fg: #FFFFFF;
  --best-bg: #DDF3E8;
  --best-fg: #064B37;
  --up: #B3261E;
  --down: #0B6B4F;
  --warn-bg: #FFF1D6;
  --warn-fg: #6B4A00;
  --focus: #1A73E8;
  --font-body: "Heebo", "Segoe UI", Arial, sans-serif;
  --font-display: "Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1614; --surface: #15211E; --fg: #E6EFEB; --muted: #93A8A0; --line: #263632;
    --accent: #4CCB98; --accent-fg: #04261B; --best-bg: #14392D; --best-fg: #A9F0D2;
    --up: #FF8A80; --down: #6FE0B0; --warn-bg: #3A2E10; --warn-fg: #FFD98A; --focus: #8AB4F8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1614; --surface: #15211E; --fg: #E6EFEB; --muted: #93A8A0; --line: #263632;
  --accent: #4CCB98; --accent-fg: #04261B; --best-bg: #14392D; --best-fg: #A9F0D2;
  --up: #FF8A80; --down: #6FE0B0; --warn-bg: #3A2E10; --warn-fg: #FFD98A; --focus: #8AB4F8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.refresh-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stamp { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
button { font-family: inherit; font-size: 15px; cursor: pointer; }
.btn {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
}
.btn:disabled { opacity: .7; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

.controls { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 12px; align-items: end; }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr; } }
label.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin-bottom: 4px; }
select, input[type="search"], input[type="text"] {
  width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 15px;
}
.cityrow { display: flex; gap: 8px; }
.cityrow select { flex: 1; min-width: 0; }
.btn2 {
  flex: none; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  border-radius: 8px; padding: 8px 12px; font-weight: 600; white-space: nowrap;
}
.btn2:hover { border-color: var(--accent); }
.cityform { display: flex; gap: 8px; margin-top: 8px; }
.cityform input { flex: 1; min-width: 0; }
.cityform .btn { flex: none; min-height: 44px; }
.search { position: relative; min-width: 0; }
.results {
  position: absolute; z-index: 20; inset-inline: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 320px; overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.14);
}
.results li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--best-bg); color: var(--best-fg); }
.results .size { color: var(--muted); font-size: 12px; margin-inline-start: 6px; }
.results li[aria-selected="true"] .size, .results li:hover .size { color: inherit; }
.results .nm { min-width: 0; }
.results .from { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.results .none { color: var(--muted); cursor: default; }
.results .none:hover { background: none; color: var(--muted); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.summary .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.summary .txt { min-width: 0; }
.summary .save { color: var(--muted); font-size: 14px; }

.grid-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
thead th { background: var(--surface); font-weight: 600; vertical-align: bottom; }
th.prod, td.prod { text-align: right; position: sticky; right: 0; background: var(--surface); z-index: 2; min-width: 170px; border-left: 1px solid var(--line); }
.chain { font-weight: 700; font-size: 14px; }
.branch { font-weight: 400; font-size: 12px; color: var(--muted); max-width: 120px; margin: 0 auto; overflow-wrap: anywhere; }
tbody tr:last-child td, tfoot td { border-bottom: 0; }
.pname { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.pname span.n { min-width: 0; }
.wt { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.rm {
  flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.rm:hover { color: var(--up); border-color: var(--up); }
.rm svg { width: 12px; height: 12px; }
td.price { font-size: 15px; white-space: nowrap; }
td.best { background: var(--best-bg); color: var(--best-fg); font-weight: 700; }
td.na { color: var(--muted); }
.delta { font-size: 11px; font-weight: 500; margin-inline-start: 4px; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
td.best .delta.down { color: var(--best-fg); }
tfoot td { background: var(--bg); font-weight: 700; border-top: 2px solid var(--line); }
tfoot td.prod { background: var(--bg); }
tfoot td.best { background: var(--accent); color: var(--accent-fg); }
.tot { font-family: var(--font-display); font-size: 17px; }
.badge { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
.miss { display: block; font-size: 11px; font-weight: 500; margin-top: 2px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 1px 6px; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.note { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.note b { background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 0 6px; font-weight: 600; flex: none; }
.warnline { font-size: 13px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 12px; margin: 0; }
</style>
</head>
<body>
<div class="app" dir="rtl" lang="he">
  <header>
    <div>
      <h1>הסל הזול</h1>
      <div class="sub">השוואת מחירי סל קניות בין סניפים בעיר שלך</div>
    </div>
    <div class="refresh-wrap">
      <span class="stamp" id="stamp" aria-live="polite"></span>
      <button class="btn" id="refresh" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span>רענן מחירים</span>
      </button>
    </div>
  </header>

  <section class="controls" aria-label="סינון וחיפוש">
    <div>
      <label class="lbl" for="city">עיר</label>
      <div class="cityrow">
        <select id="city"></select>
        <button class="btn2" id="addCityBtn" type="button" aria-expanded="false" aria-controls="cityForm" hidden>+ עיר</button>
      </div>
      <form class="cityform" id="cityForm" hidden>
        <input id="cityName" type="text" maxlength="40" placeholder="שם העיר, למשל: אילת" aria-label="שם העיר להוספה" autocomplete="off">
        <button class="btn" type="submit">הוסף</button>
      </form>
    </div>
    <div class="search">
      <label class="lbl" for="q">הוסף מוצר לסל</label>
      <input id="q" type="search" autocomplete="off" placeholder="הקלד מילה, למשל: חלב, אורז, שמן" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
  </section>

  <p class="warnline" id="warn" hidden></p>
  <section class="summary" id="summary" hidden aria-live="polite"></section>

  <section class="grid-wrap" aria-label="טבלת השוואת מחירים">
    <div id="gridHost"><div class="empty">טוען מחירים…</div></div>
  </section>

  <p class="note" id="note"></p>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Example data (used only when data/index.json is not available) ---------- */
  var CHAINS = {
    shufersal: { name: 'שופרסל', f: 1.08 },
    rami: { name: 'רמי לוי', f: 0.93 },
    yohananof: { name: 'יוחננוף', f: 0.96 },
    victory: { name: 'ויקטורי', f: 1.04 },
    yeinot: { name: 'יינות ביתן', f: 1.06 },
    osherad: { name: 'אושר עד', f: 0.95 },
    mega: { name: 'מגה', f: 1.02 },
    hatzi: { name: 'חצי חינם', f: 0.91 }
  };
  var CITIES = {
    'תל אביב-יפו': [['shufersal', 'דיזנגוף'], ['rami', 'הנמל'], ['victory', 'אבן גבירול'], ['yeinot', 'רמת אביב'], ['mega', 'יפו']],
    'ירושלים': [['shufersal', 'תלפיות'], ['rami', 'תלפיות'], ['yohananof', 'מלחה'], ['mega', 'רחביה']],
    'חיפה': [['shufersal', 'הדר'], ['rami', 'קריות'], ['victory', 'הנמל'], ['yeinot', 'קניון חיפה']],
    'באר שבע': [['rami', 'הנגב'], ['yohananof', 'באר שבע'], ['osherad', 'אזור תעשייה'], ['shufersal', 'נווה זאב']],
    'רחובות': [['shufersal', 'הרצל'], ['rami', 'רחובות'], ['yohananof', 'קרית משה'], ['hatzi', 'רחובות']],
    'ראשון לציון': [['rami', 'ראשון לציון'], ['shufersal', 'נחלת יהודה'], ['victory', 'הראשונים'], ['yeinot', 'קניון הזהב']],
    'נתניה': [['shufersal', 'נתניה'], ['rami', 'פולג'], ['osherad', 'נתניה'], ['mega', 'נתניה']],
    'אשדוד': [['rami', 'אשדוד'], ['yohananof', 'אשדוד'], ['osherad', 'אשדוד'], ['hatzi', 'אשדוד']]
  };
  var PRODUCTS = [
    ['p1', 'חלב טרה 3% 1 ליטר', 6.4], ['p2', 'לחם אחיד פרוס 750 גרם', 8.2], ['p3', 'ביצים L תריסר', 13.9],
    ['p4', 'גבינה לבנה 5% 250 גרם', 5.9], ['p5', 'גבינה צהובה עמק 28% 200 גרם', 11.5], ['p6', 'שמנת מתוקה 38% 250 מ"ל', 8.9],
    ['p7', 'יוגורט תות 150 גרם', 3.4], ['p8', 'חמאה 200 גרם', 9.9], ['p9', 'קוטג׳ 5% 250 גרם', 5.6],
    ['p10', 'אורז בסמטי 1 ק"ג', 12.9], ['p11', 'פסטה ספגטי 500 גרם', 5.9], ['p12', 'שמן קנולה 1 ליטר', 11.9],
    ['p13', 'שמן זית כתית מעולה 750 מ"ל', 39.9], ['p14', 'סוכר 1 ק"ג', 5.9], ['p15', 'קמח לבן 1 ק"ג', 4.9],
    ['p16', 'מלח שולחן 1 ק"ג', 2.9], ['p17', 'עגבניות 1 ק"ג', 6.9], ['p18', 'מלפפונים 1 ק"ג', 6.5],
    ['p19', 'בצל יבש 1 ק"ג', 4.5], ['p20', 'תפוחי אדמה 1 ק"ג', 5.2], ['p21', 'גזר 1 ק"ג', 4.9],
    ['p22', 'בננות 1 ק"ג', 7.9], ['p23', 'תפוחים 1 ק"ג', 9.9], ['p24', 'חזה עוף טרי 1 ק"ג', 36.9],
    ['p25', 'שניצל עוף קפוא 1 ק"ג', 34.9], ['p26', 'טחינה גולמית 500 גרם', 17.9], ['p27', 'חומוס מוכן 400 גרם', 9.5],
    ['p28', 'טונה בשמן 4 יח׳', 22.9], ['p29', 'קורנפלקס 750 גרם', 17.9], ['p30', 'קפה נמס 200 גרם', 24.9],
    ['p31', 'תה ויסוצקי 25 שקיות', 11.9], ['p32', 'מים מינרליים 6x1.5 ליטר', 14.9], ['p33', 'קולה 1.5 ליטר', 7.9],
    ['p34', 'נייר טואלט 32 גלילים', 39.9], ['p35', 'אבקת כביסה 3 ק"ג', 36.9], ['p36', 'נוזל כלים 750 מ"ל', 9.9],
    ['p37', 'שוקולד מריר 100 גרם', 7.9], ['p38', 'עדשים כתומות 500 גרם', 8.9], ['p39', 'קטשופ 750 גרם', 11.5],
    ['p40', 'מיונז 500 גרם', 9.9]
  ];
  var BYID = {};
  PRODUCTS.forEach(function (p) { BYID[p[0]] = { id: p[0], name: p[1], size: '', base: p[2] }; });

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  /* ---------- Mode: live (data/*.json built by collect.py) or demo ---------- */
  var live = false;
  var liveIndex = null;   // data/index.json
  var cityData = null;    // data/city-*.json of the selected city, with byId map
  var catalog = [];       // searchable products of the current mode/city

  function fetchJSON(path) {
    return fetch(path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function loadIndex() {
    return fetchJSON('data/index.json').then(function (idx) {
      if (idx && Array.isArray(idx.cities) && idx.cities.length) { liveIndex = idx; return true; }
      return false;
    }).catch(function () { return false; });
  }
  function loadCity(name) {
    var c = null;
    liveIndex.cities.forEach(function (x) { if (x.name === name) c = x; });
    if (!c) return Promise.reject(new Error('city not found'));
    return fetchJSON('data/' + c.file).then(function (d) {
      d.byId = {};
      catalog = d.products.map(function (p) {
        d.byId[p.id] = { id: p.id, name: p.n, size: p.s || '', p: p.p, w: !!p.w };
        return { id: p.id, name: p.n, size: p.s || '', w: !!p.w };
      });
      cityData = d;
    });
  }

  function getStores(city) {
    if (live) {
      return ((cityData && cityData.stores) || []).map(function (s, i) {
        return { id: s.id, chain: { name: s.cn }, branch: s.b || '', idx: i, stale: !!s.stale, asOf: s.as_of || null };
      });
    }
    /* demo: every chain appears in every city */
    var list = (CITIES[city] || []).slice();
    var have = {};
    list.forEach(function (s) { have[s[0]] = true; });
    Object.keys(CHAINS).forEach(function (k) { if (!have[k]) list.push([k, city]); });
    return list.map(function (s, i) {
      return { id: city + '|' + s[0] + '|' + s[1], chain: CHAINS[s[0]], branch: s[1], idx: i };
    });
  }
  function getPrice(pid, store, version) {
    if (live) {
      var pr = cityData && cityData.byId[pid];
      var v = pr ? pr.p[store.idx] : null;
      return v == null ? null : v;
    }
    if (hash(pid + store.id + 'avail') > 0.94) return null;
    var p = BYID[pid];
    var branchNoise = 1 + (hash(store.id + pid) - 0.5) * 0.12;
    var drift = 1 + (hash(pid + store.id + 'v' + version) - 0.5) * 0.07;
    return Math.round(p.base * store.chain.f * branchNoise * drift * 10) / 10;
  }
  function productById(pid) { return live ? (cityData && cityData.byId[pid]) : BYID[pid]; }

  /* ---------- State ---------- */
  var state = { city: '', basket: [], customCities: [], version: 3, updated: new Date() };
  function storeKey() { return live ? 'cheap-basket-live' : 'cheap-basket'; }
  function initState() {
    state.city = live ? liveIndex.cities[0].name : 'רחובות';
    state.basket = live ? [] : ['p1', 'p2', 'p3', 'p10', 'p17'];
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(storeKey()) || 'null'); } catch (e) {}
    if (!saved) return;
    if (!live && Array.isArray(saved.customCities)) {
      state.customCities = saved.customCities.filter(function (c) {
        return typeof c === 'string' && c.length > 0 && c.length <= 40 && !CITIES[c];
      }).slice(0, 50);
    }
    var valid = live
      ? liveIndex.cities.some(function (c) { return c.name === saved.city; })
      : (CITIES[saved.city] || state.customCities.indexOf(saved.city) !== -1);
    if (valid) state.city = saved.city;
    if (Array.isArray(saved.basket)) {
      state.basket = saved.basket.filter(function (id) {
        return typeof id === 'string' && (live || BYID[id]);
      }).slice(0, 100);
    }
  }
  function persist() {
    try {
      localStorage.setItem(storeKey(), JSON.stringify({ city: state.city, basket: state.basket, customCities: state.customCities }));
    } catch (e) {}
  }
  function basketIds() { return state.basket.filter(function (id) { return !!productById(id); }); }

  /* ---------- Elements ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var citySel = $('city'), q = $('q'), results = $('results'), host = $('gridHost'), summary = $('summary');
  var stamp = $('stamp'), refreshBtn = $('refresh'), warn = $('warn'), note = $('note');
  var addCityBtn = $('addCityBtn'), cityForm = $('cityForm'), cityName = $('cityName');

  function fmt(n) { return '₪' + n.toFixed(2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function minPriceFor(pid) {
    var m = null;
    getStores(state.city).forEach(function (s) {
      var p = getPrice(pid, s, state.version);
      if (p != null && (m == null || p < m)) m = p;
    });
    return m;
  }
  function ago(d) {
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 2) return 'עכשיו';
    if (m < 60) return 'לפני ' + m + ' דקות';
    var h = Math.round(m / 60);
    if (h < 48) return 'לפני ' + h + ' שעות';
    return 'לפני ' + Math.round(h / 24) + ' ימים';
  }
  function updateStamp() {
    if (live && cityData && cityData.updated_at) {
      var d = new Date(cityData.updated_at);
      if (!isNaN(d.getTime())) {
        stamp.textContent = 'נתונים מ־' + d.toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' · ' + ago(d);
        return;
      }
    }
    stamp.textContent = 'עודכן ' + state.updated.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  function updateNotes() {
    if (live) {
      note.innerHTML = '<span>המחירים נלקחים מקבצי שקיפות המחירים שהרשתות מפרסמות לפי חוק, ונאספים אוטומטית כל כמה שעות. הכפתור "רענן מחירים" טוען את העדכון האחרון. מחירי המבצעים אינם כלולים, ומחיר בסניף עשוי להיות שונה מהמחיר בקופה.</span>';
      var bad = [];
      var chains = (liveIndex && liveIndex.chains) || {};
      Object.keys(chains).forEach(function (k) { if (chains[k] && chains[k].ok === false) bad.push(chains[k].name || k); });
      if (bad.length) {
        warn.hidden = false;
        warn.textContent = 'לא התקבל עדכון חדש מ: ' + bad.join(', ') + '. אם יש נתונים קודמים, הם מסומנים כישנים.';
      } else {
        warn.hidden = true;
      }
    } else {
      note.innerHTML = '<b>נתוני דוגמה</b><span>המחירים והסניפים באפליקציה זו הם לצורך הדגמה בלבד. כדי לראות מחירים אמיתיים, האתר צריך לרוץ עם קבצי הנתונים שנוצרים על ידי collect.py.</span>';
      warn.hidden = true;
    }
  }

  /* ---------- Render ---------- */
  function render() {
    var stores = getStores(state.city);
    var ids = basketIds();
    updateStamp();
    updateNotes();

    if (!stores.length) {
      host.innerHTML = '<div class="empty"><strong>אין נתונים לעיר הזו</strong>בחר עיר אחרת.</div>';
      summary.hidden = true;
      return;
    }
    if (!ids.length) {
      host.innerHTML = '<div class="empty"><strong>הסל ריק</strong>חפש מוצר בשדה למעלה כדי להתחיל להשוות מחירים.</div>';
      summary.hidden = true;
      return;
    }

    /* sort stores by basket total, cheapest first; baskets with missing items go last */
    var stats = stores.map(function (s) {
      var sum = 0, missing = 0;
      ids.forEach(function (pid) {
        var pr = getPrice(pid, s, state.version);
        if (pr == null) missing++; else sum += pr;
      });
      return { s: s, sum: sum, missing: missing };
    });
    stats.sort(function (a, b) { return (a.missing - b.missing) || (a.sum - b.sum); });
    stores = stats.map(function (x) { return x.s; });

    var totals = stores.map(function () { return { sum: 0, missing: 0 }; });
    var head = '<th class="prod" scope="col">מוצר</th>';
    stores.forEach(function (s) {
      head += '<th scope="col"><div class="chain">' + esc(s.chain.name) + '</div><div class="branch">' + esc(s.branch) + '</div>' +
        (s.stale ? '<span class="miss" title="לא התקבל עדכון חדש מהרשת, מוצגים נתונים קודמים">נתונים ישנים</span>' : '') + '</th>';
    });

    var body = '';
    ids.forEach(function (pid) {
      var prices = stores.map(function (s) { return getPrice(pid, s, state.version); });
      var prev = stores.map(function (s) { return live ? null : getPrice(pid, s, state.version - 1); });
      var min = null;
      prices.forEach(function (p) { if (p != null && (min == null || p < min)) min = p; });
      var p = productById(pid);
      body += '<tr><td class="prod"><div class="pname"><span class="n">' + esc(p.name) + (p.w ? '<small class="wt">לפי משקל</small>' : '') + '</span>' +
        '<button class="rm" type="button" data-rm="' + esc(pid) + '" aria-label="הסר ' + esc(p.name) + ' מהסל">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div></td>';
      prices.forEach(function (pr, i) {
        if (pr == null) { body += '<td class="na">אין במלאי</td>'; totals[i].missing++; return; }
        totals[i].sum += pr;
        var cls = 'price' + (pr === min ? ' best' : '');
        var d = '';
        if (prev[i] != null && Math.abs(pr - prev[i]) >= 0.05) {
          d = pr > prev[i] ? '<span class="delta up" title="עלה מאז העדכון הקודם">▲</span>' : '<span class="delta down" title="ירד מאז העדכון הקודם">▼</span>';
        }
        body += '<td class="' + cls + '">' + fmt(pr) + d + '</td>';
      });
      body += '</tr>';
    });

    var bestIdx = -1, worst = null;
    totals.forEach(function (t, i) {
      if (t.missing !== 0) return;
      if (bestIdx < 0 || t.sum < totals[bestIdx].sum) bestIdx = i;
      if (worst == null || t.sum > worst) worst = t.sum;
    });

    var foot = '<td class="prod">סה״כ הסל</td>';
    totals.forEach(function (t, i) {
      var isBest = i === bestIdx;
      foot += '<td class="' + (isBest ? 'best' : '') + '"><span class="tot">' + fmt(t.sum) + '</span>' +
        (isBest ? '<span class="badge">הסל הזול ביותר</span>' : '') +
        (t.missing ? '<span class="miss">חסרים ' + t.missing + ' מוצרים</span>' : '') + '</td>';
    });

    host.innerHTML = '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr>' + foot + '</tr></tfoot></table>';

    if (bestIdx >= 0) {
      var bs = stores[bestIdx], save = worst - totals[bestIdx].sum;
      summary.hidden = false;
      summary.innerHTML = '<span class="big">' + fmt(totals[bestIdx].sum) + '</span>' +
        '<span class="txt"><b>' + esc(bs.chain.name) + ' · ' + esc(bs.branch) + '</b> הוא הסל הזול ביותר ב' + esc(state.city) + '</span>' +
        (save > 0.05 ? '<span class="save">חיסכון של ' + fmt(save) + ' לעומת הסניף היקר ביותר</span>' : '');
    } else {
      summary.hidden = false;
      summary.innerHTML = '<span class="txt">אף סניף לא מחזיק את כל המוצרים שבסל. הסר מוצר חסר כדי לראות סל שלם.</span>';
    }
  }

  function showError(msg) {
    host.innerHTML = '<div class="empty"><strong>' + esc(msg) + '</strong>נסה לרענן את הדף בעוד רגע.</div>';
    summary.hidden = true;
  }

  /* ---------- Search dropdown ---------- */
  /* normalize Hebrew text for matching: no quotes, niqqud or punctuation, one spelling of final letters */
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[֑-ׇ]/g, '')
      .replace(/["'`׳״’‘“”]/g, '')
      .replace(/[\-־_.,()\/*+:;%]+/g, ' ')
      .replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ')
      .replace(/\s+/g, ' ').trim();
  }
  /* drop a plural or feminine ending so "עגבניה" finds "עגבניות" and "תפוחים" finds "תפוח" */
  function stem(w) {
    if (w.length > 4 && /(ות|ים|ימ)$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && /[הת]$/.test(w)) return w.slice(0, -1);
    return w;
  }
  var active = -1, shown = [];
  function closeList() { results.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; }
  function openList() {
    var term = q.value.trim();
    if (!term) { closeList(); return; }
    var words = norm(term).split(' ').filter(Boolean).map(stem);
    if (!words.length) { closeList(); return; }
    var scored = [];
    catalog.forEach(function (p) {
      if (state.basket.indexOf(p.id) !== -1) return;
      var key = p.k || (p.k = norm(p.name));
      var score = 0;
      for (var i = 0; i < words.length; i++) {
        var at = key.indexOf(words[i]);
        if (at < 0) return;
        /* word-start matches rank above matches in the middle of a word */
        score += (at === 0 || key.charAt(at - 1) === ' ') ? 0 : 5;
        score += at / 100;
      }
      scored.push({ p: p, s: score + key.length / 1000 });
    });
    scored.sort(function (a, b) { return a.s - b.s; });
    shown = scored.slice(0, 20).map(function (x) { return x.p; });
    var html = '';
    if (!shown.length) {
      html = '<li class="none" role="option" aria-disabled="true">לא נמצאו מוצרים תואמים</li>';
    } else {
      shown.forEach(function (p, i) {
        var m = minPriceFor(p.id);
        var sz = p.w ? '<span class="size">לפי משקל</span>'
          : (p.size && p.name.indexOf(p.size) === -1 ? '<span class="size">' + esc(p.size) + '</span>' : '');
        html += '<li role="option" data-add="' + esc(p.id) + '" aria-selected="' + (i === active) + '"><span class="nm">' + esc(p.name) + sz + '</span>' +
          (m != null ? '<span class="from">מ־' + fmt(m) + '</span>' : '') + '</li>';
      });
    }
    results.innerHTML = html;
    results.hidden = false;
    q.setAttribute('aria-expanded', 'true');
  }
  function addProduct(pid) {
    if (state.basket.indexOf(pid) === -1) state.basket.push(pid);
    q.value = '';
    closeList();
    persist();
    render();
    q.focus();
  }
  q.addEventListener('input', function () { active = -1; openList(); });
  q.addEventListener('keydown', function (e) {
    if (results.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, shown.length - 1); openList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); openList(); }
    else if (e.key === 'Enter') { e.preventDefault(); var pick = shown[active >= 0 ? active : 0]; if (pick) addProduct(pick.id); }
    else if (e.key === 'Escape') { closeList(); }
  });
  results.addEventListener('mousedown', function (e) {
    var li = e.target.closest('li[data-add]');
    if (li) { e.preventDefault(); addProduct(li.getAttribute('data-add')); }
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) closeList(); });

  /* ---------- Cities ---------- */
  function fillCities() {
    var names = live
      ? liveIndex.cities.map(function (c) { return c.name; })
      : Object.keys(CITIES).concat(state.customCities);
    citySel.innerHTML = '';
    names.forEach(function (c) {
      var o = document.createElement('option'); o.value = c; o.textContent = c; citySel.appendChild(o);
    });
    citySel.value = state.city;
  }
  function toggleCityForm(open) {
    cityForm.hidden = !open;
    addCityBtn.setAttribute('aria-expanded', String(open));
    if (open) cityName.focus();
  }
  addCityBtn.addEventListener('click', function () { toggleCityForm(cityForm.hidden); });
  cityName.addEventListener('keydown', function (e) { if (e.key === 'Escape') { toggleCityForm(false); addCityBtn.focus(); } });
  cityForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (live) return;
    var name = cityName.value.replace(/\s+/g, ' ').trim();
    if (!name) { cityName.focus(); return; }
    var all = Object.keys(CITIES).concat(state.customCities);
    if (all.indexOf(name) === -1) state.customCities.push(name);
    state.city = name;
    cityName.value = '';
    toggleCityForm(false);
    fillCities(); persist(); closeList(); render();
  });
  citySel.addEventListener('change', function () {
    state.city = citySel.value; persist(); closeList();
    if (!live) { render(); return; }
    host.innerHTML = '<div class="empty">טוען מחירים…</div>';
    loadCity(state.city).then(render).catch(function () { showError('הטעינה נכשלה'); });
  });

  /* ---------- Other events ---------- */
  host.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rm]');
    if (!b) return;
    var id = b.getAttribute('data-rm');
    state.basket = state.basket.filter(function (x) { return x !== id; });
    persist(); render();
  });
  refreshBtn.addEventListener('click', function () {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.classList.add('spin');
    function done() { refreshBtn.disabled = false; refreshBtn.classList.remove('spin'); }
    if (live) {
      fetchJSON('data/index.json').then(function (idx) {
        liveIndex = idx;
        return loadCity(state.city);
      }).then(function () { done(); render(); })
        .catch(function () { done(); stamp.textContent = 'הרענון נכשל, נסה שוב'; });
      return;
    }
    setTimeout(function () {
      state.version += 1;
      state.updated = new Date();
      done();
      render();
    }, 700);
  });

  /* ---------- Start ---------- */
  loadIndex().then(function (ok) {
    live = ok;
    initState();
    addCityBtn.hidden = live;
    fillCities();
    if (!live) {
      catalog = PRODUCTS.map(function (p) { return { id: p[0], name: p[1], size: '' }; });
      render();
      return;
    }
    return loadCity(state.city).then(render).catch(function () {
      live = false;
      initState();
      addCityBtn.hidden = false;
      fillCities();
      catalog = PRODUCTS.map(function (p) { return { id: p[0], name: p[1], size: '' }; });
      render();
    });
  });
})();
</script>
</body>
</html>
