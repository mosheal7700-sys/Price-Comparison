<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הסל הזול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap">
<style>
/* Layout: one working surface. Controls on top, a store-by-product price grid below, products down the right edge (RTL), stores across the header row sorted cheapest first, basket totals in a closing row. */
:root {
  color-scheme: light;
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --fg: #14211D;
  --muted: #5B6B66;
  --line: #DAE2DF;
  --accent: #0B6B4F;
  --accent-fg: #FFFFFF;
  --best-bg: #DDF3E8;
  --best-fg: #064B37;
  --up: #B3261E;
  --down: #0B6B4F;
  --warn-bg: #FFF1D6;
  --warn-fg: #6B4A00;
  --focus: #1A73E8;
  --font-body: "Heebo", "Segoe UI", Arial, sans-serif;
  --font-display: "Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1614; --surface: #15211E; --fg: #E6EFEB; --muted: #93A8A0; --line: #263632;
    --accent: #4CCB98; --accent-fg: #04261B; --best-bg: #14392D; --best-fg: #A9F0D2;
    --up: #FF8A80; --down: #6FE0B0; --warn-bg: #3A2E10; --warn-fg: #FFD98A; --focus: #8AB4F8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1614; --surface: #15211E; --fg: #E6EFEB; --muted: #93A8A0; --line: #263632;
  --accent: #4CCB98; --accent-fg: #04261B; --best-bg: #14392D; --best-fg: #A9F0D2;
  --up: #FF8A80; --down: #6FE0B0; --warn-bg: #3A2E10; --warn-fg: #FFD98A; --focus: #8AB4F8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.refresh-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stamp { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
button { font-family: inherit; font-size: 15px; cursor: pointer; }
.btn {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
}
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.importbar { padding: 12px 14px; background: var(--best-bg); color: var(--best-fg); border-radius: 12px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.importbar[hidden], .toast[hidden] { display: none; }
.importbar button { min-height: 38px; border-radius: 999px; padding: 4px 16px; font-weight: 600; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
.importbar button.go { background: var(--accent); color: var(--accent-fg); }
.toast { position: fixed; inset-inline: 16px; bottom: 20px; margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.btn:disabled { opacity: .7; cursor: progress; }
.btn svg { width: 16px; height: 16px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

.controls { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 12px; align-items: end; }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr; } }
label.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .03em; margin-bottom: 4px; }
select, input[type="search"], input[type="text"] {
  width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 12px; font-family: inherit; font-size: 15px;
}
.cityrow { display: flex; gap: 8px; }
.cityrow select { flex: 1; min-width: 0; }
.btn2 {
  flex: none; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  border-radius: 8px; padding: 8px 12px; font-weight: 600; white-space: nowrap;
}
.btn2:hover { border-color: var(--accent); }
.cityform { display: flex; gap: 8px; margin-top: 8px; }
.cityform input { flex: 1; min-width: 0; }
.cityform .btn { flex: none; min-height: 44px; }
.search { position: relative; min-width: 0; }
.results {
  position: absolute; z-index: 20; inset-inline: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 320px; overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.14);
}
.results li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--best-bg); color: var(--best-fg); }
.results .size { color: var(--muted); font-size: 12px; margin-inline-start: 6px; }
.results li[aria-selected="true"] .size, .results li:hover .size { color: inherit; }
.results .nm { min-width: 0; }
.results .chs { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.results .chs b { color: var(--fg); font-weight: 700; }
.results li[aria-selected="true"] .chs, .results li:hover .chs, .results li[aria-selected="true"] .chs b, .results li:hover .chs b { color: inherit; }
.results .from { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.results .none { color: var(--muted); cursor: default; }
.results .none:hover { background: none; color: var(--muted); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.summary .big { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.summary .txt { min-width: 0; }
.summary .save { color: var(--muted); font-size: 14px; }

.grid-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
thead th { background: var(--surface); font-weight: 600; vertical-align: bottom; position: sticky; top: 0; z-index: 3; box-shadow: 0 1px 0 var(--line); }
th.prod, td.prod { text-align: right; position: sticky; right: 0; background: var(--surface); z-index: 2; min-width: 170px; border-left: 1px solid var(--line); }
thead th.prod { z-index: 4; }
tfoot td { position: sticky; bottom: 0; z-index: 2; }
tfoot td.prod { z-index: 4; }
.chain { font-weight: 700; font-size: 14px; }
.branch { font-weight: 400; font-size: 12px; color: var(--muted); max-width: 120px; margin: 0 auto; overflow-wrap: anywhere; }
tbody tr:last-child td, tfoot td { border-bottom: 0; }
.pname { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.pname span.n { min-width: 0; }
.wt { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.rm {
  flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.rm:hover { color: var(--up); border-color: var(--up); }
.rm svg { width: 12px; height: 12px; }
td.price { font-size: 15px; white-space: nowrap; }
td.best { background: var(--best-bg); color: var(--best-fg); font-weight: 700; }
td.na { color: var(--muted); }
.delta { font-size: 11px; font-weight: 500; margin-inline-start: 4px; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
td.best .delta.down { color: var(--best-fg); }
tfoot td { background: var(--bg); font-weight: 700; border-top: 2px solid var(--line); }
tfoot td.prod { background: var(--bg); }
tfoot td.best { background: var(--accent); color: var(--accent-fg); }
.tot { font-family: var(--font-display); font-size: 17px; }
.badge { display: block; font-size: 11px; font-weight: 600; margin-top: 2px; }
.miss { display: block; font-size: 11px; font-weight: 500; margin-top: 2px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 1px 6px; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }
.note { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.note b { background: var(--warn-bg); color: var(--warn-fg); border-radius: 4px; padding: 0 6px; font-weight: 600; flex: none; }
.warnline { font-size: 13px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 12px; margin: 0; }
.fail { padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; text-align: right; }
.fail h2 { margin: 0; font-family: var(--font-display); font-size: 18px; color: var(--up); }
.fail p, .fail li { margin: 0; color: var(--fg); }
.fail ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.fail code { direction: ltr; unicode-bidi: embed; background: var(--bg); border-radius: 4px; padding: 0 4px; font-size: 13px; }
.fail .chainlist { font-size: 13px; color: var(--muted); }
.fail .btn { align-self: flex-start; }
.results li.bar { position: sticky; top: 0; z-index: 1; justify-content: center; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.results li.bar:hover { background: var(--accent); color: var(--accent-fg); }
.results li { justify-content: flex-start; }
.results li .nm { flex: 1; }
.pickzone { flex: none; align-self: stretch; display: flex; align-items: center; justify-content: center; min-width: 52px; margin-block: -10px; margin-inline: -10px 0; cursor: pointer; }
.pick { flex: none; width: 28px; height: 28px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.pickhint { font-size: 12px; color: var(--muted); }
tr.grp td.prod { box-shadow: inset -3px 0 0 var(--accent); }
td.counted { font-weight: 700; box-shadow: inset 0 0 0 2px var(--accent); }
td.alt { color: var(--muted); }
.dx { display: block; font-size: 11px; font-weight: 500; color: var(--up); }
.acts { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.keep { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; min-height: 28px; }
.keep:hover { background: var(--best-bg); }
.lostbar { padding: 10px 14px; background: var(--warn-bg, #fff4d6); color: var(--warn-fg, #6b4a00); border-radius: 12px; font-size: 14px; line-height: 1.6; }
.lostbar[hidden] { display: none; }
.lostbar ul { list-style: none; margin: 6px 0 0; padding: 0; }
.lostbar li { display: flex; align-items: center; gap: 8px; }
.lostbar button { min-height: 28px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; padding: 0 12px; }
.mv { flex: none; display: flex; flex-direction: column; gap: 2px; }
.mv button { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.mv button:hover:not(:disabled) { background: var(--best-bg); color: var(--accent); border-color: var(--accent); }
.mv button:disabled { opacity: .3; cursor: default; }
.mv svg { width: 14px; height: 14px; }
.orig { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 150px; margin: 3px auto 0; font-size: 11px; font-weight: 400; line-height: 1.25; color: var(--muted); }
td[data-pin] { cursor: pointer; }
td[data-pin]:hover { background: var(--best-bg); }
.pinlbl { display: block; font-size: 10px; font-weight: 600; color: var(--accent); }
.mergebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; background: var(--best-bg); color: var(--best-fg); border-radius: 12px; font-weight: 600; }
.mergebar[hidden] { display: none; }
.mergebar button { min-height: 36px; border-radius: 999px; padding: 4px 16px; font-weight: 600; border: 1px solid var(--accent); }
.mergebar .go { background: var(--accent); color: var(--accent-fg); }
.mergebar .no { background: transparent; color: var(--accent); }
.mg { flex: none; width: 18px; height: 18px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.gcount { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
tr.sub td.prod { padding-inline-start: 28px; background: var(--bg); }
tr.sub td { background: var(--bg); }
.grphint { font-size: 12px; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="app" dir="rtl" lang="he">
  <header>
    <div>
      <h1>הסל הזול</h1>
      <div class="sub">השוואת מחירי סל קניות בין סניפים בעיר שלך</div>
    </div>
    <div class="refresh-wrap">
      <span class="stamp" id="stamp" aria-live="polite"></span>
      <button class="btn" id="refresh" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span>רענן מחירים</span>
      </button>
      <button class="btn ghost" id="share" type="button" title="קישור שמעביר את הסל הזה למכשיר אחר">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/></svg>
        <span>העבר סל</span>
      </button>
    </div>
  </header>
  <div class="importbar" id="importbar" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <section class="controls" aria-label="סינון וחיפוש">
    <div>
      <label class="lbl" for="city">עיר</label>
      <select id="city"></select>
    </div>
    <div class="search">
      <label class="lbl" for="q">הוסף מוצר לסל</label>
      <input id="q" type="search" autocomplete="off" placeholder="הקלד מילה, למשל: חלב, אורז, שמן" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
  </section>

  <p class="warnline" id="warn" hidden></p>
  <section class="summary" id="summary" hidden aria-live="polite"></section>

  <div class="lostbar" id="lostbar" hidden></div>

  <div class="mergebar" id="mergebar" hidden></div>

  <section class="grid-wrap" aria-label="טבלת השוואת מחירים">
    <div id="gridHost"><div class="empty">טוען מחירים…</div></div>
  </section>

  <p class="note" id="note"></p>
</div>

<script>
(function () {
  'use strict';

  /* Prices come only from data/*.json, built by collect.py (GitHub Actions).
     There is no sample data: when the files are missing the page says exactly what failed. */
  var liveIndex = null;   // data/index.json
  var cityData = null;    // data/city-*.json of the selected city, with byId map
  var catalog = [];       // searchable products of the selected city

  function fetchJSON(path) {
    return fetch(path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }
  function loadIndex() {
    return fetchJSON('data/index.json').then(function (idx) {
      if (!idx || !Array.isArray(idx.cities)) { var e = new Error('bad format'); e.kind = 'format'; throw e; }
      liveIndex = idx;
      if (!idx.cities.length) { var e2 = new Error('no cities'); e2.kind = 'empty'; throw e2; }
    });
  }
  function loadCity(name) {
    var c = null;
    liveIndex.cities.forEach(function (x) { if (x.name === name) c = x; });
    if (!c) { var e = new Error('city not found'); e.kind = 'nocity'; return Promise.reject(e); }
    return fetchJSON('data/' + c.file).then(function (d) {
      d.byId = {};
      catalog = d.products.map(function (p) {
        d.byId[p.id] = { id: p.id, name: p.n, size: p.s || '', p: p.p, w: !!p.w };
        return { id: p.id, name: p.n, size: p.s || '', w: !!p.w };
      });
      cityData = d;
    }).catch(function (err) { err.file = 'data/' + c.file; throw err; });
  }

  function getStores() {
    return ((cityData && cityData.stores) || []).map(function (s, i) {
      return { id: s.id, chain: { name: s.cn }, branch: s.b || '', idx: i, stale: !!s.stale, asOf: s.as_of || null };
    });
  }
  function getPrice(pid, store) {
    var pr = cityData && cityData.byId[pid];
    var v = pr ? pr.p[store.idx] : null;
    return v == null ? null : v;
  }
  function productById(pid) { return cityData && cityData.byId[pid]; }

  /* ---------- State ---------- */
  /* groups: product id -> group id. Products in one group are alternatives to each other,
     and only the cheapest of them in each store counts towards that store's basket total. */
  var state = { city: '', basket: [], groups: {}, names: {}, pins: {} };   // pins: group id -> store id -> the product chosen by hand for that store   // names: id -> {n, s} of basket items, so an item missing from newer data is not lost silently
  var lastUnits = [];     // the rows of the table as last drawn, for moving them
  var focusMove = null;   // keeps keyboard focus on the arrow that was just used
  var mergeSel = [];      // rows ticked for merging: product ids, or 'g:'+group id
  var expanded = {};      // merged rows currently opened
  var STORE_KEY = 'cheap-basket-live';
  function cleanGroups() {
    var n = {};
    Object.keys(state.groups).forEach(function (id) {
      if (state.basket.indexOf(id) === -1) { delete state.groups[id]; return; }
      var g = state.groups[id]; n[g] = (n[g] || 0) + 1;
    });
    Object.keys(state.groups).forEach(function (id) { if (n[state.groups[id]] < 2) delete state.groups[id]; });
    Object.keys(state.pins).forEach(function (g) {
      Object.keys(state.pins[g]).forEach(function (sid) {
        var pid = state.pins[g][sid];
        if (state.basket.indexOf(pid) === -1 || state.groups[pid] !== g) delete state.pins[g][sid];
      });
      if (!Object.keys(state.pins[g]).length) delete state.pins[g];
    });
  }
  function initState() {
    state.city = liveIndex.cities[0].name;
    state.basket = [];
    state.groups = {};
    state.names = {};
    state.pins = {};
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
    if (!saved) return;
    if (liveIndex.cities.some(function (c) { return c.name === saved.city; })) state.city = saved.city;
    if (Array.isArray(saved.basket)) {
      state.basket = saved.basket.filter(function (id) { return typeof id === 'string'; }).slice(0, 100);
    }
    if (saved.groups && typeof saved.groups === 'object') {
      Object.keys(saved.groups).forEach(function (id) {
        if (typeof saved.groups[id] === 'string') state.groups[id] = saved.groups[id];
      });
    }
    if (saved.names && typeof saved.names === 'object') {
      Object.keys(saved.names).forEach(function (id) {
        var v = saved.names[id];
        if (v && typeof v.n === 'string') state.names[id] = { n: v.n, s: typeof v.s === 'string' ? v.s : '', c: typeof v.c === 'string' ? v.c : '' };
      });
    }
    if (saved.pins && typeof saved.pins === 'object') {
      Object.keys(saved.pins).forEach(function (g) {
        var m = saved.pins[g];
        if (!m || typeof m !== 'object') return;
        Object.keys(m).forEach(function (sid) { if (typeof m[sid] === 'string') { (state.pins[g] = state.pins[g] || {})[sid] = m[sid]; } });
      });
    }
    cleanGroups();
  }
  /* A product's id can change between data updates. When a saved item is gone, look for the same
     name and size in the current catalog; if exactly one product matches, the item moves to it. */
  function chainSig(pid) {
    var seen = {};
    getStores().forEach(function (s) { if (getPrice(pid, s) != null) seen[s.chain.name] = 1; });
    return Object.keys(seen).sort().join('|');
  }
  function healBasket() {
    if (!cityData) return;
    var byName = null;
    state.basket.slice().forEach(function (id) {
      if (productById(id)) return;

        '<span class="n">' + esc(p.name) + (p.w ? '<small class="wt">לפי משקל</small>' : '') + '</span>' +
        '<span class="acts">' +
        (g ? '<button class="keep" type="button" data-keep="' + esc(pid) + '" title="להשאיר רק את המוצר הזה ולהסיר את שאר המוצרים בהשוואה">השאר</button>' : '') +
        '<button class="rm" type="button" data-rm="' + esc(pid) + '" aria-label="הסר ' + esc(p.name) + ' מהסל">' + xsvg + '</button></span></div></td>';
      prices.forEach(function (pr, i) {
        if (pr == null) { h += '<td class="na">אין במלאי</td>'; return; }
        var cls = 'price', extra = '', attr = '';
        if (g) {
          var c = totals[i].counted[g];
          attr = ' data-pin="' + esc(pid) + '" data-gid="' + esc(g) + '" data-sid="' + esc(stores[i].id) + '"';
          if (c && c.id === pid) {
            cls += ' counted';
            if (c.pinned) { cls += ' pinned'; extra = '<span class="pinlbl" title="נבחר ידנית לחנות הזו. לחיצה מחזירה לבחירה האוטומטית">נבחר ידנית ✕</span>'; attr += ' title="לחיצה מחזירה לבחירה האוטומטית (הזול ביותר)"'; }
          } else {
            attr += ' title="לחיצה בוחרת את הגרסה הזו לחנות הזו"';
            cls += ' alt';
            if (c && pr - c.price >= 0.005) extra = '<span class="dx" dir="ltr" title="כמה יקר יותר מהמוצר הזול בהשוואה, באותה חנות">+' + fmt(pr - c.price) + '</span>';
          }
        } else {
          if (pr === min) cls += ' best';
          else if (i === 0 && pr - min >= 0.005) extra = '<span class="dx" dir="ltr" title="כמה יקר יותר מהמחיר הזול ביותר בשורה, בחנות אחרת">+' + fmt(pr - min) + '</span>';
        }
        h += '<td class="' + cls + '"' + attr + '>' + fmt(pr) + extra + '</td>';
      });
      return h + '</tr>';
    }

    var anyOpen = false;
    units.forEach(function (u, ui) {
      if (!u.group) { body += productRow(u.ids[0], null, false, mvHtml(ui)); return; }
      /* merged group: one row, each store shows the cheapest variant it carries */
      var open = !!expanded[u.group];
      if (open) anyOpen = true;
      var ups = stores.map(function (s) { return unitPrice(u, s); });
      var prices = ups.map(function (x) { return x.price; });
      var min = null;
      prices.forEach(function (pr) { if (pr != null && (min == null || pr < min)) min = pr; });
      var p0 = productById(u.ids[0]);
      var anyW = u.ids.some(function (id) { return productById(id).w; });
      body += '<tr class="grp gsum"><td class="prod"><div class="pname">' + mvHtml(ui) + cbox('g:' + u.group) +
        '<span class="n">' + esc(p0.name) + '<small class="gcount">' + u.ids.length + ' גרסאות' + (anyW ? ' · לפי משקל' : '') + '</small></span>' +
        '<span class="acts">' +
        '<button class="keep" type="button" data-toggle="' + esc(u.group) + '" aria-expanded="' + open + '" title="הצג או הסתר את הגרסאות ובחר אחת להשאיר">' + (open ? 'הסתר' : 'הצג') + '</button>' +
        '<button class="keep" type="button" data-split="' + esc(u.group) + '" title="פרק לשורות נפרדות">פרק</button>' +
        '<button class="rm" type="button" data-rmgroup="' + esc(u.group) + '" aria-label="הסר את כל הגרסאות מהסל">' + xsvg + '</button></span></div></td>';
      prices.forEach(function (pr, i) {
        if (pr == null) { body += '<td class="na">אין במלאי</td>'; return; }
        var cls = 'price', extra = '';
        if (pr === min) cls += ' best';
        else if (i === 0 && pr - min >= 0.005) extra = '<span class="dx" dir="ltr" title="כמה יקר יותר מהמחיר הזול ביותר בשורה, בחנות אחרת">+' + fmt(pr - min) + '</span>';
        var who = productById(ups[i].id);
        var desc = who ? '<span class="orig" title="' + esc(who.name) + '">' + esc(who.name) + (ups[i].pinned ? ' · ידני' : '') + '</span>' : '';
        body += '<td class="' + cls + '">' + fmt(pr) + extra + desc + '</td>';
      });
      body += '</tr>';
      if (open) {
        u.ids.forEach(function (id) { body += productRow(id, u.group, true); });
      }
    });

    var mb = $('mergebar');
    if (mergeSel.length >= 2) {
      mb.hidden = false;
      mb.innerHTML = '<span>סומנו ' + mergeSel.length + ' שורות</span><button type="button" class="go" data-merge="1">אחד לשורה אחת</button><button type="button" class="no" data-mergecancel="1">בטל</button>';
    } else if (mergeSel.length === 1) {
      mb.hidden = false;
      mb.innerHTML = '<span>סמן עוד שורה כדי לאחד אותן לשורה אחת</span><button type="button" class="no" data-mergecancel="1">בטל</button>';
    } else { mb.hidden = true; mb.innerHTML = ''; }

    var bestIdx = -1, worst = null;
    totals.forEach(function (t, i) {
      if (t.missing !== 0) return;
      if (bestIdx < 0 || t.sum < totals[bestIdx].sum) bestIdx = i;
      if (worst == null || t.sum > worst) worst = t.sum;
    });

    var foot = '<td class="prod">סה״כ הסל</td>';
    totals.forEach(function (t, i) {
      var isBest = i === bestIdx;
      foot += '<td class="' + (isBest ? 'best' : '') + '"><span class="tot">' + fmt(t.sum) + '</span>' +
        (isBest ? '<span class="badge">הסל הזול ביותר</span>' : '') +
        (t.missing ? '<span class="miss">חסרים ' + t.missing + ' מוצרים</span>' : '') + '</td>';
    });

    host.innerHTML = '<table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr>' + foot + '</tr></tfoot></table>' +
      (anyOpen ? '<p class="grphint" style="padding:8px 12px">בשורה ממוזגת, בכל חנות נספרת בסכום רק הגרסה שבמסגרת, כברירת מחדל הזולה ביותר שם. המספר באדום הוא התוספת אם תבחר בגרסה אחרת. לחיצה על מחיר של גרסה בחנות מסוימת בוחרת אותה לחנות הזו, ולחיצה נוספת מחזירה לבחירה האוטומטית. "השאר" משאיר גרסה אחת.</p>' : '');

    if (focusMove) {
      var fb = host.querySelector('[data-mv="' + focusMove.dir + '"][data-tok="' + focusMove.tok.replace(/"/g, '\\"') + '"]');
      if (fb && !fb.disabled) { fb.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest' }); }
      else { var other = host.querySelector('[data-tok="' + focusMove.tok.replace(/"/g, '\\"') + '"]:not(:disabled)'); if (other) other.focus({ preventScroll: true }); }
      focusMove = null;
    }

    /* buying every item where it is cheapest, in as many stores as needed */
    var split = 0, splitOk = true;
    units.forEach(function (u) {
      var m = null;
      stores.forEach(function (s) { var up = unitPrice(u, s); if (up.price != null && (m == null || up.price < m)) m = up.price; });
      if (m == null) splitOk = false; else split += m;
    });

    if (bestIdx >= 0) {
      var bs = stores[bestIdx], save = worst - totals[bestIdx].sum, splitSave = totals[bestIdx].sum - split;
      summary.hidden = false;
      summary.innerHTML = '<span class="big">' + fmt(totals[bestIdx].sum) + '</span>' +
        '<span class="txt"><b>' + esc(bs.chain.name) + ' · ' + esc(bs.branch) + '</b> הוא הסל הזול ביותר ב' + esc(state.city) + '</span>' +
        (save > 0.05 ? '<span class="save">חיסכון של ' + fmt(save) + ' לעומת הסניף היקר ביותר</span>' : '') +
        (splitOk && splitSave >= 0.5 ? '<span class="save">קנייה מפוצלת, הזול בכל שורה בכמה חנויות: ' + fmt(split) + ' (עוד ' + fmt(splitSave) + ' חיסכון)</span>' : '');
    } else {
      summary.hidden = false;
      summary.innerHTML = '<span class="txt">אף סניף לא מחזיק את כל המוצרים שבסל. הסר מוצר חסר כדי לראות סל שלם.</span>';
    }
  }

  /* ---------- Search dropdown ---------- */
  var LIMIT = 100;
  var active = -1, shown = [], sel = [];
  function closeList() { results.hidden = true; q.setAttribute('aria-expanded', 'false'); active = -1; sel = []; }

  /* every word must appear anywhere in the name, in any order; words that start a word rank first */
  function nf(s) { return s.replace(/ך/g, 'כ').replace(/ם/g, 'מ').replace(/ן/g, 'נ').replace(/ף/g, 'פ').replace(/ץ/g, 'צ'); }
  function search(words) {
    var hits = [];
    /* a typed plural or feminine ending is dropped, so "מלפפונים" also finds "מלפפון" and "עגבניה" finds "עגבניות" */
    words = words.map(nf).map(function (w) {
      if (w.length > 4 && (w.slice(-2) === 'ימ' || w.slice(-2) === 'ות')) return w.slice(0, -2);
      if (w.length >= 4 && w.slice(-1) === 'ה') return w.slice(0, -1);
      return w;
    });
    catalog.forEach(function (p) {
      if (state.basket.indexOf(p.id) !== -1) return;
      var name = p.k || (p.k = nf(p.name)), notStart = 0, first = 0;
      for (var i = 0; i < words.length; i++) {
        var at = name.indexOf(words[i]);
        if (at < 0) return;
        if (!(at === 0 || name.charAt(at - 1) === ' ')) notStart++;
        if (i === 0) first = at;
      }
      hits.push({ p: p, a: notStart, b: first, c: name.length });
    });
    hits.sort(function (x, y) { return (x.a - y.a) || (x.b - y.b) || (x.c - y.c); });
    return hits.map(function (h) { return h.p; });
  }
  function openList(keepScroll) {
    var term = q.value.trim();
    if (!term) { closeList(); return; }
    var words = term.split(/\s+/).filter(Boolean);
    var all = search(words);
    shown = all.slice(0, LIMIT);
    var top = keepScroll ? results.scrollTop : 0;
    var html = '';
    if (sel.length) html += '<li class="bar" role="option" data-addsel="1">הוסף ' + sel.length + (sel.length === 1 ? ' מוצר' : ' מוצרים להשוואה') + '</li>';
    if (!shown.length) {
      html += '<li class="none" role="option" aria-disabled="true">לא נמצאו מוצרים תואמים</li>';
    } else {
      shown.forEach(function (p, i) {
        var m = minPriceFor(p.id);
        var sz = p.w ? '<span class="size">לפי משקל</span>'
          : (p.size && p.name.indexOf(p.size) === -1 ? '<span class="size">' + esc(p.size) + '</span>' : '');
        html += '<li role="option" data-add="' + esc(p.id) + '" aria-selected="' + (i === active) + '">' +
          '<span class="pickzone"><input type="checkbox" class="pick" tabindex="-1" aria-label="סמן להשוואה"' + (sel.indexOf(p.id) !== -1 ? ' checked' : '') + '></span>' +
          '<span class="nm">' + esc(p.name) + sz + '<span class="chs">' + (chainsFor(p.id).join(' · ') || 'אין מחיר') + '</span></span>' +
          (m != null ? '<span class="from">מ־' + fmt(m) + '</span>' : '') + '</li>';
      });
      if (all.length > shown.length) {
        html += '<li class="none" role="option" aria-disabled="true">מוצגים ' + shown.length + ' מתוך ' + all.length + '. הוסף מילה כדי לצמצם.</li>';
      } else if (shown.length > 1 && !sel.length) {
        html += '<li class="none pickhint" role="option" aria-disabled="true">אפשר לסמן כמה מוצרים ולהשוות ביניהם</li>';
      } else if (sel.length) {
        html += '<li class="none pickhint" role="option" aria-disabled="true">לחיצה על שורה מסמנת אותה. להוספה: הפס הירוק למעלה או Enter</li>';
      }
    }
    results.innerHTML = html;
    results.hidden = false;
    results.scrollTop = top;
    q.setAttribute('aria-expanded', 'true');
  }
  function addProducts(list) {
    list = list.filter(function (id, i) { return state.basket.indexOf(id) === -1 && list.indexOf(id) === i; });
    if (!list.length) return;
    var gid = list.length > 1 ? 'g' + Date.now().toString(36) : null;
    list.forEach(function (id) { state.basket.push(id); if (gid) state.groups[id] = gid; });
    q.value = '';
    closeList();
    persist();
    render();
    q.focus();
  }
  function togglePick(id) {
    var i = sel.indexOf(id);
    if (i === -1) sel.push(id); else sel.splice(i, 1);
    openList(true);
  }
  q.addEventListener('input', function () { active = -1; openList(); });
  q.addEventListener('keydown', function (e) {
    if (results.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, shown.length - 1); openList(true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); openList(true); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (sel.length) { addProducts(sel.slice()); return; }
      var pick = shown[active >= 0 ? active : 0];
      if (pick) addProducts([pick.id]);
    }
    else if (e.key === 'Escape') { closeList(); }
  });
  results.addEventListener('mousedown', function (e) {
    if (e.target.closest('li[data-addsel]')) { e.preventDefault(); addProducts(sel.slice()); return; }
    var li = e.target.closest('li[data-add]');
    if (!li) return;
    e.preventDefault();
    var id = li.getAttribute('data-add');
    /* the checkbox and the area around it tick the row; while something is ticked, a click anywhere
       on a row ticks it too, so a missed checkbox never drops the selection */
    if (e.target.closest('.pickzone') || sel.length) togglePick(id); else addProducts([id]);
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) closeList(); });

  /* ---------- Cities ---------- */
  function fillCities() {
    citySel.innerHTML = '';
    liveIndex.cities.forEach(function (c) {
      var o = document.createElement('option'); o.value = c.name; o.textContent = c.name; citySel.appendChild(o);
    });
    citySel.value = state.city;
  }
  citySel.addEventListener('change', function () {
    state.city = citySel.value; mergeSel = []; persist(); closeList();
    host.innerHTML = '<div class="empty">טוען מחירים…</div>';
    loadCity(state.city).then(function () { healBasket(); persist(); render(); }).catch(showFailure);
  });

  /* ---------- Other events ---------- */
  host.addEventListener('click', function (e) {
    if (e.target.closest('#retry')) { start(); return; }
    var k = e.target.closest('[data-keep]');
    if (k) {
      var keepId = k.getAttribute('data-keep'), g = state.groups[keepId];
      state.basket = state.basket.filter(function (x) { return x === keepId || state.groups[x] !== g; });
      delete state.groups[keepId];
      persist(); render();
      return;
    }
    var mvb = e.target.closest('[data-mv]');
    if (mvb && !mvb.disabled) {
      var dir = mvb.getAttribute('data-mv'), tok = mvb.getAttribute('data-tok');
      var at = -1;
      lastUnits.forEach(function (u, i) { if ((u.group ? 'g:' + u.group : u.ids[0]) === tok) at = i; });
      var to = dir === 'up' ? at - 1 : at + 1;
      if (at === -1 || to < 0 || to >= lastUnits.length) return;
      var order = lastUnits.slice(); var tmp = order[at]; order[at] = order[to]; order[to] = tmp;
      var next = [];
      order.forEach(function (u) { u.ids.forEach(function (id) { next.push(id); }); });
      state.basket.forEach(function (id) { if (next.indexOf(id) === -1) next.push(id); });   // items missing from the data keep a place
      state.basket = next;
      focusMove = { dir: dir, tok: tok };
      persist(); render();
      return;
    }
    var pc = e.target.closest('td[data-pin]');
    if (pc) {
      var pg_ = pc.getAttribute('data-gid'), ps_ = pc.getAttribute('data-sid'), pp_ = pc.getAttribute('data-pin');
      state.pins[pg_] = state.pins[pg_] || {};
      if (state.pins[pg_][ps_] === pp_) { delete state.pins[pg_][ps_]; } else { state.pins[pg_][ps_] = pp_; }
      persist(); render();
      return;
    }
    var mgc = e.target.closest('input.mg');
    if (mgc) {
      var tok = mgc.getAttribute('data-mg'), at = mergeSel.indexOf(tok);
      if (at === -1) mergeSel.push(tok); else mergeSel.splice(at, 1);
      render();
      return;
    }
    var tg = e.target.closest('[data-toggle]');
    if (tg) { var tgid = tg.getAttribute('data-toggle'); expanded[tgid] = !expanded[tgid]; render(); return; }
    var sp = e.target.closest('[data-split]');
    if (sp) {
      var spid = sp.getAttribute('data-split');
      Object.keys(state.groups).forEach(function (id) { if (state.groups[id] === spid) delete state.groups[id]; });
      delete expanded[spid];
      persist(); render();
      return;
    }
    var rg = e.target.closest('[data-rmgroup]');
    if (rg) {
      var rgid = rg.getAttribute('data-rmgroup');
      state.basket = state.basket.filter(function (x) { return state.groups[x] !== rgid; });
      persist(); render();
      return;
    }
    var b = e.target.closest('[data-rm]');
    if (!b) return;
    var id = b.getAttribute('data-rm');
    state.basket = state.basket.filter(function (x) { return x !== id; });
    persist(); render();
  });
  $('lostbar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-rmlost]');
    if (!b) return;
    var id = b.getAttribute('data-rmlost');
    state.basket = state.basket.filter(function (x) { return x !== id; });
    delete state.names[id];
    persist(); render();
  });
  $('mergebar').addEventListener('click', function (e) {
    if (e.target.closest('[data-mergecancel]')) { mergeSel = []; render(); return; }
    if (!e.target.closest('[data-merge]')) return;
    var members = [], gids = {};
    mergeSel.forEach(function (t) {
      if (t.indexOf('g:') === 0) gids[t.slice(2)] = true; else members.push(t);
    });
    state.basket.forEach(function (id) { if (gids[state.groups[id]]) members.push(id); });
    var firstG = Object.keys(gids)[0];
    var gid = firstG || 'g' + Date.now().toString(36);
    members.forEach(function (id) { state.groups[id] = gid; });
    expanded[gid] = false;
    mergeSel = [];
    persist(); render();
  });
  refreshBtn.addEventListener('click', function () {
    if (refreshBtn.disabled) return;
    refreshBtn.disabled = true;
    refreshBtn.classList.add('spin');
    start().then(function () {
      refreshBtn.disabled = false; refreshBtn.classList.remove('spin');
    });
  });

  function showImportBar() {
    var bar = $('importbar');
    if (!pendingImport) { bar.hidden = true; bar.innerHTML = ''; return; }
    bar.hidden = false;
    bar.innerHTML = '<span>הקישור כולל סל של ' + pendingImport.basket.length + ' מוצרים' + (pendingImport.city ? ' בעיר ' + esc(pendingImport.city) : '') + '. מה לעשות?</span>' +
      '<button type="button" class="go" data-imp="replace">החלף את הסל שלי</button>' +
      '<button type="button" data-imp="merge">הוסף לסל שלי</button>' +
      '<button type="button" data-imp="ignore">התעלם</button>';
  }
  $('importbar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-imp]');
    if (!b || !pendingImport) return;
    var mode = b.getAttribute('data-imp'), inc = pendingImport, n = inc.basket.length;
    pendingImport = null;
    if (mode === 'ignore') { showImportBar(); return; }
    var cityBefore = state.city;
    applyIncoming(inc, mode);
    persist();
    showImportBar();
    var done = function () { healBasket(); persist(); render(); toast(mode === 'replace' ? 'הסל הוחלף' : 'המוצרים נוספו לסל'); };
    if (state.city !== cityBefore) {
      citySel.value = state.city;
      host.innerHTML = '<div class="empty">טוען מחירים…</div>';
      loadCity(state.city).then(done).catch(showFailure);
    } else done();
  });
  $('share').addEventListener('click', function () {
    if (!state.basket.length) { toast('הסל ריק. הוסף מוצרים ואז העבר אותו'); return; }
    shareLink().then(function (url) {
      if (navigator.share) {
        navigator.share({ title: 'הסל הזול', text: 'הסל שלי (' + state.basket.length + ' מוצרים)', url: url }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast('הקישור הועתק. פתח אותו במכשיר האחר'); },
          function () { window.prompt('העתק את הקישור ופתח אותו במכשיר האחר:', url); });
      } else { window.prompt('העתק את הקישור ופתח אותו במכשיר האחר:', url); }
    });
  });
  window.addEventListener('hashchange', function () { if (/^#[bz]=/.test(location.hash)) location.reload(); });

  /* ---------- Start ---------- */
  function start() {
    host.innerHTML = '<div class="empty">טוען מחירים…</div>';
    return loadIndex().then(function () {
      initState();
      pendingImport = null;
      return readIncoming();
    }).then(function (inc) {
      if (inc) {
        if (state.basket.length) pendingImport = inc;
        else { applyIncoming(inc, 'replace'); persist(); incomingNotice = 'הסל נטען מהקישור (' + inc.basket.length + ' מוצרים)'; }
      }
      q.disabled = false; q.placeholder = 'הקלד מילה, למשל: חלב, אורז, שמן';
      citySel.disabled = false;
      fillCities();
      return loadCity(state.city).then(function () {
        healBasket(); persist(); render();
        showImportBar();
        if (incomingNotice) { toast(incomingNotice); incomingNotice = ''; }
      });
    }).catch(showFailure);
  }
  start();
})();
</script>
</body>
</html>
