name: עדכון מחירים ופרסום האתר

on:
  schedule:
    # 10 תזמונים, בדקות שונות, בערך כל 12 דקות במשך שעתיים (שעות UTC): GitHub מדלג על חלק מההרצות המתוזמנות ומאחר אחרות,
    # ולכן מנסים הרבה פעמים. שלב 'בדיקת מרווח' מדלג על ניסיון אם האיסוף האחרון היה לפני פחות מ-MIN_GAP_MIN דקות,
    # כך שבפועל רץ איסוף אחד לכל כשעתיים, ואם ניסיון נכשל או נדחה, הבא אחריו (בעוד כ-12 דקות) יפעל במקומו.
    - cron: '10 5 * * *'
    - cron: '10 6 * * *'
    - cron: '10 7 * * *'
    - cron: '10 15 * * *'
    - cron: '10 17 * * *'
    - cron: "1 */2 * * *"
    - cron: "7 */2 * * *"
    - cron: "13 */2 * * *"
    - cron: "18 */2 * * *"
    - cron: "24 */2 * * *"
    - cron: "31 */1 * * *"
    - cron: "37 */2 * * *"
    - cron: "43 */2 * * *"
    - cron: "49 */2 * * *"
    - cron: "56 */2 * * *"
    - cron: "3 1-23/2 * * *"
    - cron: "13 1-23/2 * * *"
    - cron: "25 1-23/2 * * *"
    - cron: "37 1-23/2 * * *"
    - cron: "49 1-23/2 * * *"
  workflow_dispatch:           # הרצה ידנית מלשונית Actions
  push:
    branches: [main]
    paths:
      - index.html
      - status.html
      - collect.py
      - config.json
      - requirements.txt
      - .github/workflows/update.yml
      - scripts/guard.py

permissions:
  contents: read
  actions: read          # כדי שבדיקת המרווח תקרא את היסטוריית ההרצות
  pages: write
  id-token: write

jobs:
  guard:
    # מדלג על ניסיון מתוזמן אם איסוף (שלב build) התחיל לפני פחות מ-MIN_GAP_MIN דקות או עדיין רץ. הנתון נלקח מהיסטוריית ההרצות
    # של GitHub (לא מקובץ מטמון), כדי ששני ניסיונות לא יאספו יחד. הרצה ידנית והעלאה אף פעם לא מדולגות.
    # הבדיקה לא ממתינה לאיסוף שרץ (אין concurrency כאן), לכן ניסיון שמגיע באמצע איסוף מדלג מיד.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: בדיקת מרווח
        id: g
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: update.yml
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/index.json
          MIN_GAP_MIN: "90"
        run: python3 scripts/guard.py

  build:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    concurrency:
      group: collect
      cancel-in-progress: false
    # כברירת מחדל רץ על שרתי GitHub. אם הרשתות חוסמות אותם, אפשר להגדיר
    # משתנה מאגר בשם RUNNER_LABEL ולהריץ על מחשב בישראל (self-hosted runner).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: איסוף מחירים
        env:
          PREV_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: python collect.py --out site/data --prev-base "$PREV_BASE"

      - name: הרכבת האתר
        run: cp index.html status.html site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
